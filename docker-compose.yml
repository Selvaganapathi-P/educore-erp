version: '3.9'

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: educore
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [educore]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/educore
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    networks: [educore]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""       # empty = same-origin (nginx proxies /api → api:5000)
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks: [educore]

volumes:
  mongo_data:

networks:
  educore:
    driver: bridge
